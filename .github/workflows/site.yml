# 매시간 시세 받기 → 순위 계산 → Cloudflare Pages 에 사이트 올리기 (매시간 실행은 Cloudflare Worker 가 눌러 준다)
# Cloudflare Pages 프로젝트(don-duruwa)는 이미 만들어 뒀다. 새로 만들 땐: npx wrangler pages project create don-duruwa --production-branch=main
# 처음 한 번: 저장소 Settings → Secrets and variables → Actions 에
#   CLOUDFLARE_API_TOKEN (Cloudflare Pages 편집 권한 토큰), CLOUDFLARE_ACCOUNT_ID 를 넣어 둔다.
# 지금 바로 갱신하고 싶으면: Actions 탭 → "사이트 갱신" → Run workflow
name: 사이트 갱신

on:
  # 매시간 갱신은 Cloudflare Worker(cron/worker.js) 가 매시간 17분에 workflow_dispatch 로 눌러 준다.
  # GitHub 자체 schedule 은 몇 시간씩 안 돌거나 늦어서 뺐다 (같이 두면 한 시간에 두 번 돈다).
  workflow_dispatch:
  push:
    paths: ["ffxiv/**", "web/**", "functions/**", "config.yaml", ".github/workflows/site.yml"]

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 필요한 것 설치
        run: pip install requests pyyaml
      # 📈 재료 트래킹 가격 기록 (실행할 때마다 이어 붙인다)
      - name: 가격 기록 불러오기
        uses: actions/cache/restore@v4
        with:
          path: cache/history.json.gz
          key: history-${{ github.run_id }}
          restore-keys: history-
      - name: 시세 받고 계산
        run: python -m ffxiv.build
      - name: 가격 기록 저장
        uses: actions/cache/save@v4
        with:
          path: cache/history.json.gz
          key: history-${{ github.run_id }}
      - name: Cloudflare Pages 에 올리기
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=don-duruwa --branch=main --commit-dirty=true
