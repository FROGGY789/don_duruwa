# 매시간 시세 받기 → 순위 계산 → Cloudflare Pages 에 사이트 올리기
# 처음 한 번: 저장소 Settings → Secrets and variables → Actions 에
#   CLOUDFLARE_API_TOKEN (Cloudflare Pages 편집 권한 토큰), CLOUDFLARE_ACCOUNT_ID 를 넣어 둔다.
# 지금 바로 갱신하고 싶으면: Actions 탭 → "사이트 갱신" → Run workflow
name: 사이트 갱신

on:
  schedule:
    - cron: "17 * * * *"  # 매시간 17분 (정각은 GitHub 가 붐벼서 늦어진다)
  workflow_dispatch:
  push:
    paths: ["ffxiv/**", "web/**", "functions/**", "config.yaml", ".github/workflows/site.yml"]

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 필요한 것 설치
        run: pip install requests pyyaml
      - name: 시세 받고 계산
        run: python -m ffxiv.build
      - name: Cloudflare Pages 프로젝트 만들기 (처음 한 번만, 이미 있으면 넘어감)
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create don-duruwa --production-branch=main
      - name: Cloudflare Pages 에 올리기
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=don-duruwa --branch=main --commit-dirty=true
